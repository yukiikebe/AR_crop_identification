MODEL:
  architecture:  "TSViT"
  img_res: 24
  max_seq_len: 20
  num_channels: 11
  num_features: 16
  num_classes:  5
  ignore_background: False
  dropout: 0.
  patch_size: 2
  dim: 128
  temporal_depth: 4
  spatial_depth: 4
  heads: 4
  pool: 'cls'
  dim_head: 32
  emb_dropout: 0.
  scale_dim: 4

DATASETS:
  class_config: "configs/Arkansas/arkansas_data.yaml"
  max_doy: 180
  train:
    dataset: "AR23"
    label_map:
    max_seq_len: 20
    batch_size: 64
    extra_data:
    num_workers: 4
  eval:
    dataset: "AR23"
    label_map:
    max_seq_len: 20
    batch_size: 64
    extra_data:
    num_workers: 4

  test:
    dataset: "AR23"
    label_map:
    max_seq_len: 20
    batch_size: 64
    extra_data:
    num_workers: 4

SOLVER:
  num_epochs: 200
  num_warmup_epochs: 10
  steps: (0, 80000)
  loss_function:  masked_focal_loss
  gamma: 2.0
  class_weights:
  lr_scheduler: 'cosine'
  lr_base: 1e-5
  lr_min: 5e-6
  lr_start: 1e-8
  num_cycles: 1
  reset_lr: True   # resets lr to base value when loading pretrained model
  weight_decay: 0.000

CHECKPOINT:
  load_from_checkpoint: #'models/saved_models/AR23_focal/best.pth'
  partial_restore: False
  save_path: 'models/saved_models/AR23_focal_06mo/'
  train_metrics_steps: 50
  eval_steps: 5000
  save_steps: 5000
DEVICE: 
  device_id: [0]
